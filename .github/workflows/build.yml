name: Build Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yarrperator/rtorrent
  ALPINE_VERSION: "3.24"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get rtorrent version
        id: rtorrent-ver
        run: |
          RT_VER=$(docker run --rm alpine:${{ env.ALPINE_VERSION }} sh -c 'apk add --no-cache rtorrent >/dev/null 2>&1 && apk info rtorrent | head -1')
          echo "version=$RT_VER" >> $GITHUB_OUTPUT

      - name: Bake and push
        uses: docker/bake-action@v6
        with:
          push: true
          set: |
            default.tags=[
              "${{ env.IMAGE }}:latest",
              "${{ env.IMAGE }}:alpine${{ env.ALPINE_VERSION }}-rtorrent${{ steps.rtorrent-ver.outputs.version }}",
              "${{ env.IMAGE }}:sha-${{ github.sha }}"
            ]
